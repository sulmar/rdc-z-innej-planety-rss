name: Testy

on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "public/**", "docs/**", "README.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install '.[dev]'
      - run: pytest -q
