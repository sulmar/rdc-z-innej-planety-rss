[project]
name = "rdc-podcast-feed"
version = "0.1.0"
description = "Generator kanału RSS dla audycji „Z innej planety” Polskiego Radia RDC"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rdc = "rdc.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rdc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
